name: test-build-apk

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  schedule:
    # Every Sunday at 03:00 UTC.
    - cron: "0 3 * * 0"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-schedule:
    name: Check scheduled run
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Check last commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_COMMIT=$(gh api \
            repos/${{ github.repository }}/commits/master \
            --jq '.[0].commit.author.date')

          LAST_COMMIT_EPOCH=$(date -d "$LAST_COMMIT" +%s)
          NOW_EPOCH=$(date +%s)
          AGE_DAYS=$(( (NOW_EPOCH - LAST_COMMIT_EPOCH) / 86400 ))

          echo "Last commit: $LAST_COMMIT"
          echo "Age: ${AGE_DAYS} days"

          if [ "$AGE_DAYS" -ge 90 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Analyze & test
    needs: check-schedule
    if: |
      always() &&
      (
        github.event_name != 'schedule' ||
        needs.check-schedule.outputs.should_run == 'true'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check tracked secret material
        run: bash tool/check_tracked_secrets.sh

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated code is up to date
        run: git diff --exit-code -- lib

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > assets/.env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> assets/.env
          echo "POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}" >> assets/.env
          echo "POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}" >> assets/.env

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: flutter test

  integration:
    name: Integration tests (Android emulator)
    needs: [test, check-schedule]
    if: |
      always() &&
      (
        github.event_name != 'schedule' ||
        needs.check-schedule.outputs.should_run == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # `flutter test` only walks `test/`. `integration_test/` needs a real
      # device, so without this job those files would never run in CI.
      # api-level 36 matches compileSdk (flutter.compileSdkVersion).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator runner needs `assets/.env` (main.dart throws without
      # SUPABASE_URL/SUPABASE_KEY) and `google-services.json` before Gradle can
      # assemble the test APK. Building the debug APK once up-front also warms
      # the Gradle daemon, which otherwise races the test run and fails
      # `assembleDebug` intermittently.
      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > assets/.env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> assets/.env
          echo "POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}" >> assets/.env
          echo "POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}" >> assets/.env

      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Warm the Gradle build
        run: flutter build apk --debug

      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test integration_test

  build:
    name: Build APK
    needs: [test, integration, check-schedule]
    if: |
      always() &&
      needs.test.result == 'success' &&
      needs.integration.result == 'success' &&
      github.event_name != 'pull_request' &&
      (
        github.event_name != 'schedule' ||
        needs.check-schedule.outputs.should_run == 'true'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated code is up to date
        run: git diff --exit-code -- lib

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > assets/.env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> assets/.env
          echo "POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}" >> assets/.env
          echo "POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}" >> assets/.env

      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: budgly-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
