name: test-build-apk

env:
  FLUTTER_VERSION: "3.47.5"
  DART_VERSION: "3.13.4"

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  schedule:
    # Every Sunday at 03:00 UTC.
    - cron: "0 3 * * 0"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-schedule:
    name: Check scheduled run
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Check last commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_COMMIT=$(gh api \
            repos/${{ github.repository }}/commits/master \
            --jq '.commit.author.date')

          LAST_COMMIT_EPOCH=$(date -d "$LAST_COMMIT" +%s)
          NOW_EPOCH=$(date +%s)
          AGE_DAYS=$(( (NOW_EPOCH - LAST_COMMIT_EPOCH) / 86400 ))

          echo "Last commit: $LAST_COMMIT"
          echo "Age: ${AGE_DAYS} days"

          if [ "$AGE_DAYS" -ge 90 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Analyze & test
    needs: check-schedule
    if: |
      always() &&
      (
        github.event_name != 'schedule' ||
        needs.check-schedule.outputs.should_run == 'true'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify pinned Flutter/Dart toolchain
        run: bash tool/verify_toolchain.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Check tracked secret material
        run: bash tool/check_tracked_secrets.sh

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Generated .g.dart files are intentionally gitignored; build_runner
      # is the source of truth in CI, so there is no meaningful git diff check.

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Create .env file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?Missing SUPABASE_URL secret}"
          : "${SUPABASE_KEY:?Missing SUPABASE_KEY secret}"
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" > assets/.env
          printf 'SUPABASE_KEY=%s\n' "$SUPABASE_KEY" >> assets/.env
          printf 'POSTHOG_API_KEY=%s\n' "$POSTHOG_API_KEY" >> assets/.env
          printf 'POSTHOG_HOST=%s\n' "$POSTHOG_HOST" >> assets/.env
          printf 'GOOGLE_SERVER_CLIENT_ID=%s\n' "$GOOGLE_SERVER_CLIENT_ID" >> assets/.env

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: flutter test

      # The runner is in UTC, where calendar-date arithmetic bugs cannot show.
      # Re-run the date-sensitive suites under zones with a DST change on a
      # Sunday (Europe/Paris, America/New_York) and one whose DST ends on a
      # Saturday night (America/Santiago, see
      # test/regression/calendar_arithmetic_dst_test.dart).
      - name: Run date-sensitive tests under other timezones
        run: |
          set -euo pipefail
          for tz in Europe/Paris America/New_York America/Santiago; do
            echo "::group::TZ=$tz"
            TZ="$tz" flutter test \
              test/regression/calendar_arithmetic_dst_test.dart \
              test/models/expense/stored_calendar_date_test.dart \
              test/services/expenses/recurring_series_service_test.dart
            echo "::endgroup::"
          done

  integration:
    name: Integration tests (Android emulator)
    needs: [test, check-schedule]
    if: |
      always() &&
      (
        github.event_name != 'schedule' ||
        needs.check-schedule.outputs.should_run == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify pinned Flutter/Dart toolchain
        run: bash tool/verify_toolchain.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # `flutter test` only walks `test/`. `integration_test/` needs a real
      # device, so without this job those files would never run in CI.
      # api-level 36 matches compileSdk (flutter.compileSdkVersion).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator runner needs `assets/.env` (main.dart throws without
      # SUPABASE_URL/SUPABASE_KEY) and `google-services.json` before Gradle can
      # assemble the test APK. Building the debug APK once up-front also warms
      # the Gradle daemon, which otherwise races the test run and fails
      # `assembleDebug` intermittently.
      - name: Create .env file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?Missing SUPABASE_URL secret}"
          : "${SUPABASE_KEY:?Missing SUPABASE_KEY secret}"
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" > assets/.env
          printf 'SUPABASE_KEY=%s\n' "$SUPABASE_KEY" >> assets/.env
          printf 'POSTHOG_API_KEY=%s\n' "$POSTHOG_API_KEY" >> assets/.env
          printf 'POSTHOG_HOST=%s\n' "$POSTHOG_HOST" >> assets/.env
          printf 'GOOGLE_SERVER_CLIENT_ID=%s\n' "$GOOGLE_SERVER_CLIENT_ID" >> assets/.env

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          : "${GOOGLE_SERVICES_JSON_BASE64:?Missing GOOGLE_SERVICES_JSON secret}"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Warm the Gradle build
        run: flutter build apk --debug

      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test integration_test

  build:
    name: Build APK
    needs: [test, integration, check-schedule]
    if: |
      always() &&
      needs.test.result == 'success' &&
      needs.integration.result == 'success' &&
      github.event_name != 'pull_request' &&
      (
        github.event_name != 'schedule' ||
        needs.check-schedule.outputs.should_run == 'true'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify pinned Flutter/Dart toolchain
        run: bash tool/verify_toolchain.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Generated .g.dart files are intentionally gitignored; build_runner
      # is the source of truth in CI, so there is no meaningful git diff check.

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Create .env file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?Missing SUPABASE_URL secret}"
          : "${SUPABASE_KEY:?Missing SUPABASE_KEY secret}"
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" > assets/.env
          printf 'SUPABASE_KEY=%s\n' "$SUPABASE_KEY" >> assets/.env
          printf 'POSTHOG_API_KEY=%s\n' "$POSTHOG_API_KEY" >> assets/.env
          printf 'POSTHOG_HOST=%s\n' "$POSTHOG_HOST" >> assets/.env
          printf 'GOOGLE_SERVER_CLIENT_ID=%s\n' "$GOOGLE_SERVER_CLIENT_ID" >> assets/.env

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          : "${GOOGLE_SERVICES_JSON_BASE64:?Missing GOOGLE_SERVICES_JSON secret}"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json

      # Release signing material never lives in the repository
      # (tool/check_tracked_secrets.sh rejects it if it is ever tracked).
      # android/app/build.gradle.kts picks up android/key.properties and
      # falls back to the debug key when it is absent, so decoding it here
      # is what switches the release APK from debug to release signing.
      # The keystore path in the stored key.properties must be `budgly.jks`
      # (resolved against android/app/ by Gradle's file()).
      - name: Restore release signing (key.properties + keystore)
        env:
          ANDROID_KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEY_PROPERTIES_BASE64:?Missing ANDROID_KEY_PROPERTIES_BASE64 secret}"
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/budgly.jks
          test -s android/app/budgly.jks
          printf '%s' "$ANDROID_KEY_PROPERTIES_BASE64" | base64 --decode > android/key.properties
          test -s android/key.properties

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: budgly-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
