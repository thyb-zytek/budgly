name: budgly
description: "A budget-tracking application"
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.0.0
  firebase_auth: ^6.5.7
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.0.0
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  flutter_dotenv: ^6.0.0
  flutter_localizations:
    sdk: flutter
  go_router: ^17.4.0
  google_sign_in: ^7.1.1
  image_cropper: ^12.2.1
  image_picker: ^1.2.3
  intl: ^0.20.2
  path_provider: ^2.1.5
  posthog_flutter: ^5.37.0
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  firebase_auth_mocks: ^0.15.2
  fake_cloud_firestore: ^4.2.0
  mock_exceptions: ^0.8.2
  coverage: ^1.15.1
  test_cov_console: ^0.2.2
  http: ^1.6.0
  path_provider_platform_interface: ^2.1.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/saira/
    - assets/.env
    - assets/icons/category_icons.json

  fonts:
    - family: Saira
      fonts:
        - asset: assets/fonts/saira/Saira-VariableFont_wdth,wght.ttf
        - asset: assets/fonts/saira/Saira-Italic-VariableFont_wdth,wght.ttf
          style: italic

flutter_intl:
  enabled: true